[project]
name = "pokemon-team-builder"
version = "0.1.0"
description = "Backend of the Pokémon Team Builder: stored PokéAPI copy, teams, counter teams, change alerts."
requires-python = ">=3.13,<3.14"
dependencies = [
    "argon2-cffi==25.1.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.9",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Preview mode is needed for PLR1702 (nesting); explicit-preview-rules keeps every
# other preview rule off.
preview = true
explicit-preview-rules = true
select = [
    "E", "F", "W",   # pycodestyle and pyflakes
    "I",             # import order
    "B",             # likely bugs
    "UP",            # modern syntax
    "SIM",           # simpler forms
    "C901",          # cyclomatic complexity
    "PLR0912",       # too many branches
    "PLR0915",       # too many statements
    "PLR1702",       # too many nested blocks
]

# Sort `app` as this project's own code even for a module that does not exist yet.
[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 40
max-nested-blocks = 3

[tool.mypy]
strict = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
