# Local Postgres for development and tests only. The deployed site uses a
# managed database; nothing here is used in production.
services:
  db:
    # The one place the Postgres version is written. Keep it on the same major
    # version as the deployed database.
    image: &postgres-image postgres:18
    environment:
      POSTGRES_USER: pokemon
      POSTGRES_DB: pokemon
      # Generated into the git-ignored .env by `make .env`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run "make .env" first}
    ports:
      # Reachable from this computer only. 5433, so that a Postgres already
      # installed on the default port 5432 does not clash.
      - "127.0.0.1:5433:5432"
    volumes:
      # From version 18 the image keeps its data in /var/lib/postgresql/<major>/docker
      # and declares its volume at /var/lib/postgresql, so the volume goes there.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Over TCP: the image's first-time setup server listens only on its local socket
      # (listen_addresses='' in docker-entrypoint.sh), so this waits for the real server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pokemon -d pokemon"]
      interval: 2s
      timeout: 3s
      retries: 30

  # For `make burst` only: a throwaway database held to the deployed database's size
  # (0.1 CPU, 256 MB) and reached over TLS, as the deployed one is. No volume: every run
  # starts empty. The certificate is the self-signed one the image ships with.
  db-burst:
    image: *postgres-image
    profiles: [burst]
    cpus: 0.1
    mem_limit: 256m
    environment:
      POSTGRES_USER: pokemon
      POSTGRES_DB: pokemon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run "make .env" first}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      - -c
      - ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      # Over TCP: the image's first-time setup server listens only on its local socket
      # (listen_addresses='' in docker-entrypoint.sh), so this waits for the real server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pokemon -d pokemon"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  pgdata:
